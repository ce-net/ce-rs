[package]
name = "ce-rs"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for CE — a typed async client for talking to a local CE node."
license = "AGPL-3.0-only"
repository = "https://github.com/ce-net/ce-rs"
keywords = ["ce", "distributed-compute", "p2p", "sdk"]
categories = ["api-bindings", "network-programming"]

[dependencies]
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
futures-core = "0.3"
futures-util = "0.3"
bytes = "1"
tokio = { version = "1", features = ["time", "macros"], optional = true }
tracing = { version = "0.1", optional = true }

# The transparent same-host fast path (ce-lane's `node` router target): shared-memory rings
# instead of local HTTP when <data_dir>/lane.sock exists, silent HTTP fallback otherwise.
# ce-lane is deliberately dependency-light (no libp2p/bollard) so this does not violate the
# "SDK stays thin" rule; its mux runs on std threads + futures-channel, so the base SDK stays
# runtime-agnostic.
[target.'cfg(unix)'.dependencies]
ce-lane = { git = "https://github.com/ce-net/ce" }
futures-channel = "0.3"

[features]
# `serve` adds the reusable mesh-app serving loop (ce_rs::serve). It pulls a tokio timer +
# tracing; the base SDK stays runtime-agnostic and dependency-light without it.
serve = ["dep:tokio", "dep:tracing"]
# `locate` adds mesh-native service discovery + instance selection (ce_rs::locate): the keystone
# every higher SDK uses to pick which live instance of a service to talk to. Pulls a tokio
# timer (re-advertise heartbeat) + tracing.
locate = ["dep:tokio", "dep:tracing"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "process"] }
proptest = "1"
futures-util = "0.3"
